[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["service/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["E501"]
[tool.coverage.run]
source = ["service"]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/tests/*",
]
[tool.coverage.report]
fail_under = 85
show_missing = true
