<div class="compact-list">{% for order in orders %}<a href="{% url 'staff_order_detail' order.pk %}"><span><b>{{ order.number }}</b><small>{{ order.customer.name }} · {{ order.vehicle }}</small></span><span><em class="status-dot status-{{ order.status }}"></em>{{ order.get_status_display }}<small>{{ order.desired_date|date:'d.m.Y' }}</small></span></a>{% empty %}<div class="staff-empty">Нет заказов в этой группе.</div>{% endfor %}</div>
