<!doctype html><html lang="ru"><body style="margin:0;background:#f4f3ef;font-family:Arial,sans-serif;color:#171918"><table role="presentation" width="100%"><tr><td align="center" style="padding:32px 12px"><table role="presentation" width="600" style="max-width:100%;background:#fff;border:1px solid #dedfda"><tr><td style="background:#111315;color:#fff;padding:22px 28px"><b style="letter-spacing:3px">AUTORA</b></td></tr><tr><td style="padding:30px"><p style="color:#f04f24;font-size:12px">ЗАКАЗ {{ order.number }}</p><h1 style="font-size:26px">{{ message }}</h1><p>Текущий статус: <b>{{ order.get_status_display }}</b></p>{% if tracking_url %}<p><a href="{{ tracking_url }}" style="display:inline-block;background:#f04f24;color:#fff;text-decoration:none;padding:13px 18px">Открыть статус заказа</a></p><p style="color:#6b706d;font-size:13px">Ссылка персональная. Не передавайте её посторонним.</p>{% else %}<p>Защищённая ссылка недоступна. Свяжитесь с сервисом.</p>{% endif %}</td></tr></table></td></tr></table></body></html>
